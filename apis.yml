name: Projectx
description: >-
  ProjectX is a San Francisco-based Y Combinator (Spring 2026) startup building
  Infinity (InfinityOS), a cloud operating system designed for AI agents. Infinity
  lets agents and humans orchestrate GPU workloads through a chat interface rather
  than traditional APIs, running multiple Windows and Linux applications — such as
  Blender, VS Code, DaVinci Resolve, Unreal Engine, and Isaac Sim — simultaneously,
  each on its own independent compute and GPU inside a single shared browser-based
  workspace with sub-minute cold starts. A public API, developer docs, status page,
  changelog, and blog are announced as coming soon; no programmatic API surface is
  published yet.
